<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LingoQuest Test</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; background: #a8d8ee; color: #1c1c1c; margin: 0; padding: 16px; }
  h1 { text-align: center; margin: 8px 0 16px; }
  .box { background: #f3f4f8; border-radius: 12px; padding: 16px; max-width: 480px; margin: 0 auto 16px; }
  h2 { margin: 0 0 12px; font-size: 22px; color: #b00000; }
  label, .btn { display: block; }
  input[type=text], select { width: 100%; box-sizing: border-box; font-size: 20px; padding: 10px; margin: 6px 0 12px; border: 2px solid #5a1450; border-radius: 8px; }
  .btn { width: 100%; box-sizing: border-box; text-align: center; background: #f064a0; color: #fff; font-size: 22px; font-weight: bold; padding: 14px; border: 3px solid #5a1450; border-radius: 12px; cursor: pointer; }
  .btn:disabled { opacity: 0.5; }
  #photoInput { display: none; }
  #preview { width: 100%; border-radius: 8px; margin-top: 12px; display: none; }
  .result { font-size: 24px; font-weight: bold; margin-top: 14px; min-height: 30px; }
  .small { font-size: 16px; color: #333; margin-top: 6px; }
</style>
</head>
<body>

<h1>LingoQuest Test</h1>

<div class="box">
  <h2>1. Hunt: show an object</h2>
  <label>Word to find (in English)</label>
  <input type="text" id="huntWord" value="cup">
  <label class="btn" for="photoInput">Take a photo</label>
  <input type="file" id="photoInput" accept="image/*" capture="environment">
  <img id="preview" alt="your photo">
  <div class="result" id="huntResult"></div>
</div>

<div class="box">
  <h2>2. Speak: say the word</h2>
  <label>Language</label>
  <select id="lang">
    <option value="ja">Japanese</option>
    <option value="fr">French</option>
    <option value="es">Spanish</option>
  </select>
  <label>Word you will say (optional, to check it)</label>
  <input type="text" id="speakWord" placeholder="for example: りんご">
  <button class="btn" id="recBtn">Record (3 seconds)</button>
  <div class="result" id="speakResult"></div>
  <div class="small" id="speakNote"></div>
</div>

<script>
// ---------- HUNT ----------
const photoInput = document.getElementById("photoInput");
const huntResult = document.getElementById("huntResult");
const preview = document.getElementById("preview");

photoInput.addEventListener("change", async () => {
  const file = photoInput.files[0];
  if (!file) return;
  const word = document.getElementById("huntWord").value.trim();
  if (word === "") { huntResult.textContent = "Type the word first."; return; }

  preview.src = URL.createObjectURL(file);          // show the photo
  preview.style.display = "block";
  huntResult.textContent = "Checking...";

  try {
    const small = await shrink(file);                // smaller photo = faster
    const form = new FormData();
    form.append("word", word);
    form.append("photo", small, "photo.jpg");
    const res = await fetch("/hunt", { method: "POST", body: form });
    if (!res.ok) throw new Error("server " + res.status);
    const data = await res.json();
    huntResult.textContent = data.correct ? "Yes! I see a " + word : "No, I don't see a " + word;
  } catch (err) {
    huntResult.textContent = "Error: " + err.message;
  }
  photoInput.value = "";                             // so the same photo can be chosen again
});

function shrink(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 640 / Math.max(img.width, img.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      canvas.toBlob(blob => resolve(blob), "image/jpeg", 0.8);
    };
    img.onerror = () => reject(new Error("could not read the photo"));
    img.src = URL.createObjectURL(file);
  });
}

// ---------- SPEAK ----------
const recBtn = document.getElementById("recBtn");
const speakResult = document.getElementById("speakResult");
const speakNote = document.getElementById("speakNote");

recBtn.addEventListener("click", async () => {
  if (!navigator.mediaDevices) {
    speakResult.textContent = "The microphone needs https. Use the Render link.";
    return;
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    speakResult.textContent = "Microphone not allowed.";
    return;
  }

  const recorder = new MediaRecorder(stream);
  const chunks = [];
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = () => {
    stream.getTracks().forEach(t => t.stop());       // turn the mic off
    sendAudio(new Blob(chunks, { type: recorder.mimeType }));
  };

  recBtn.disabled = true;
  speakNote.textContent = "";
  speakResult.textContent = "Speak now!";
  recorder.start();
  setTimeout(() => recorder.stop(), 3000);           // 3 seconds like the game
});

async function sendAudio(blob) {
  speakResult.textContent = "Listening...";
  const type = blob.type || "audio/webm";
  const ext = type.includes("mp4") ? "mp4" : type.includes("ogg") ? "ogg" : "webm";
  const form = new FormData();
  form.append("language", document.getElementById("lang").value);
  form.append("recording", blob, "speech." + ext);
  const start = Date.now();

  try {
    const res = await fetch("/speak", { method: "POST", body: form });
    if (!res.ok) throw new Error("server " + res.status);
    const data = await res.json();
    const heard = data.heard.trim();
    const seconds = ((Date.now() - start) / 1000).toFixed(1);
    const wanted = document.getElementById("speakWord").value.trim();

    if (wanted !== "" && clean(heard).includes(clean(wanted))) {
      speakResult.textContent = "Correct! I heard: " + heard;
    } else if (wanted !== "") {
      speakResult.textContent = "Try again. I heard: " + heard;
    } else {
      speakResult.textContent = "I heard: " + heard;
    }
    speakNote.textContent = "Took " + seconds + " seconds";
  } catch (err) {
    speakResult.textContent = "Error: " + err.message;
  }
  recBtn.disabled = false;
}

function clean(text) {                               // lowercase, no spaces or punctuation
  return text.toLowerCase().replace(/[\s.,!?。、！？'"]/g, "");
}
</script>
</body>
</html>
